# HTTP (cổng 80): chỉ để Let's Encrypt gia hạn chứng chỉ + chuyển hướng sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAME@;

    location /.well-known/acme-challenge/ {
        root @ACME_ROOT@;
    }

    location / {
        return 301 https://$host@HTTPS_SUFFIX@$request_uri;
    }
}

server {
    listen @HTTPS_PORT@ ssl;
    listen [::]:@HTTPS_PORT@ ssl;
    server_name @SERVER_NAME@;

    ssl_certificate @SSL_CERT@;
    ssl_certificate_key @SSL_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:workping_ssl:10m;
    ssl_session_timeout 1d;

    # Gõ nhầm http:// vào cổng HTTPS → chuyển sang https://
    error_page 497 =301 https://$host:$server_port$request_uri;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
