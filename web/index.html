<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WorkPing – Quản lý tiến độ & nhắc việc</title>
    <meta name="description" content="Giao việc, theo dõi tiến độ và nhắc việc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1F4E78" />
    <!-- iOS: chạy như ứng dụng khi "Thêm vào Màn hình chính" -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WorkPing" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /* Bỏ lề mặc định của trình duyệt: tránh viền trắng & thanh cuộn thừa */
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { margin: 0; padding: 0; min-height: 100%; }
      body { background: #f5f5f5; }
      /* Vùng tai thỏ / thanh trạng thái iPhone khi mở từ Màn hình chính (status-bar-style black-translucent):
         nội dung phải chừa chỗ, và tô nền đậm để chữ giờ/pin (màu trắng) nhìn thấy được */
      :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
      .safe-top { position: fixed; top: 0; left: 0; right: 0; height: var(--sat); background: #1F4E78; z-index: 1100; pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="safe-top"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
